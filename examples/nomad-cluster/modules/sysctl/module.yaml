name: sysctl
description: Kernel parameters for routing, UDP buffers (Tailscale, QUIC) and file watches.
tags: [base, network]
tasks:
  - sysctl.param: { name: net.ipv4.ip_forward, value: 1 }
  - sysctl.param: { name: net.ipv6.conf.all.forwarding, value: 1 }
  # Tailscale and QUIC want larger UDP socket buffers than the kernel default.
  - sysctl.param: { name: net.core.rmem_max, value: 7500000 }
  - sysctl.param: { name: net.core.wmem_max, value: 7500000 }
  - sysctl.param: { name: fs.inotify.max_user_watches, value: 524288 }
  - sysctl.param: { name: vm.overcommit_memory, value: 1 }
