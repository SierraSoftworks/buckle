name: rustic
description: Nightly encrypted backups of the Nomad state with rustic, on the Pis that have a backup disk.
when: 'host.groups contains "pis"'
tags: [backup]
vars:
  rustic_version: "v0.9.5"
  rustic_repository: /mnt/backup/rustic      # a USB disk mounted at /mnt/backup
  rustic_mount: /mnt/backup
  rustic_schedule: "*-*-* 02:30:00"
  rustic_keep_daily: 7
  rustic_keep_weekly: 4
  rustic_sources:                            # a typed list: the template loops over it
    - /opt/nomad/data
    - /etc/nomad.d
tasks:
  - github.release:
      repo: rustic-rs/rustic
      version: '{{ vars.rustic_version }}'
      asset: "rustic-{tag}-{arch}-unknown-linux-musl.tar.gz"
      arch_map: { x86_64: x86_64, aarch64: aarch64 }     # armv7l: no build, reported as blocked
      extract: rustic
      dest: /usr/local/bin/rustic
      mode: "0755"
      probe: ["rustic", "--version"]
      probe_regex: 'rustic (\S+)'
    tags: [network]

  - file.directory: { path: /etc/rustic, mode: "0750" }

  # The repository password is a secret delivered by the environment provider;
  # the file is root-only and the plan shows a fingerprint token, not the value.
  - file.template:
      src: rustic.toml.j2
      dest: /etc/rustic/rustic.toml
      mode: "0600"

  # `only_if` is the guard that matters: if the USB disk is not mounted,
  # /mnt/backup is a directory on the SD card and `creates` alone would happily
  # initialise a repository there.
  - command.run:
      run: ["rustic", "init"]
      only_if: "mountpoint -q {{ vars.rustic_mount }}"
      creates: '{{ vars.rustic_repository }}/config'
      timeout: 2m
    removal: leave                           # a backup repository is never deleted by a config edit

  - file.template:
      src: rustic-backup.service.j2
      dest: /etc/systemd/system/rustic-backup.service
      mode: "0644"
    notify: [daemon-reload]
  - file.template:
      src: rustic-backup.timer.j2
      dest: /etc/systemd/system/rustic-backup.timer
      mode: "0644"
    notify: [daemon-reload]

  # Enable and start the *timer* only. There is deliberately no systemd.unit
  # for rustic-backup.service: starting a oneshot service runs a backup, and an
  # apply must never do that. The timer starts it on schedule.
  - systemd.unit:
      name: rustic-backup.timer
      enabled: true
      active: true
      daemon_reload: true

handlers:
  daemon-reload:
    systemd.daemon_reload: {}

health:
  - name: timer
    systemd: { unit: rustic-backup.timer, state: active }
  - name: recent-backup
    file: { path: /var/lib/rustic/last-backup, max_age: 26h }
    required: false      # informational: it cannot pass until the first scheduled run has happened
