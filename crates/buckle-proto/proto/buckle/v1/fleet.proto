syntax = "proto3";

package buckle.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// The fleet protocol between Buckle agents and the Buckle server.
//
// One long-lived bidirectional Session stream per agent carries control and
// reporting messages; bulk content (revision trees, large blobs) is fetched
// through separate server-streaming calls so it never blocks the session.
service Fleet {
  // The long-lived session. The agent speaks first with Hello.
  rpc Session(stream AgentMessage) returns (stream ServerMessage);

  // The tarball (gzip) of a revision's modules/, vars/ and buckle.yaml.
  rpc FetchRevision(FetchRevisionRequest) returns (stream Chunk);

  // A single large file by content digest.
  rpc FetchBlob(FetchBlobRequest) returns (stream Chunk);

  // Secrets the host needs for modules it selected after its facts changed.
  rpc FetchSecrets(FetchSecretsRequest) returns (SecretBundle);

  // A short-lived JWT the agent exchanges for a cluster credential (a Nomad
  // ACL login, or a Kubernetes bearer token). Granted only for a cluster
  // target the host may act for, and audited.
  rpc IssueIdentity(IssueIdentityRequest) returns (IssuedIdentity);
}

// ---------------------------------------------------------------- agent → server

message AgentMessage {
  oneof msg {
    Hello hello = 1;
    Facts facts = 2;
    Heartbeat heartbeat = 3;
    PlanResult plan = 4;
    ApplyEvent apply = 5;
    ApplyResult result = 6;
    HealthReport health = 7;
    Drift drift = 8;
    LocalRollback rollback = 9;
    UpgradeResult upgrade = 10;
    RebootFailed reboot_failed = 11;
  }
}

message Hello {
  string host_id = 1;
  string agent_version = 2;
  // Seed labels from agent.yaml; server labels override them.
  map<string, string> labels = 3;
  // Revision currently applied, if any.
  string applied_revision = 4;
  // Digest of the last plan the agent produced, if any.
  string last_plan_digest = 5;
  // Per-host token issued at enrolment, or the bootstrap token on first contact.
  string token = 6;
  // Operating system and architecture, for the UI before facts arrive.
  string platform = 7;
  string arch = 8;
  bool bootstrap = 9;
  // Revisions whose Apply is running now, or ran and whose ApplyResult the
  // server has not acknowledged yet (it follows the Welcome). A server
  // waiting on such an apply waits for the result instead of re-sending it.
  repeated string unreported_apply_revisions = 10;
  // Optional behaviours this agent understands (e.g. "force_plan"), so the
  // server can offer them only where they work.
  repeated string capabilities = 11;
  // The identity of the current boot (Linux boot_id), when the host exposes
  // one. A server waiting on a reboot (ApplyResult.reboot) takes a session
  // from another boot as the host back from it.
  string boot_id = 12;
}

message Facts {
  // The facts document as JSON.
  bytes json = 1;
  google.protobuf.Timestamp collected_at = 2;
  // The target this concerns: a cluster target's name, or empty for the
  // host itself.
  string target = 3;
}

message Heartbeat {
  google.protobuf.Timestamp at = 1;
  // Liveness only; health travels in HealthReport.
  string applied_revision = 2;
  bool busy = 3;
}

message PlanResult {
  string revision = 1;
  string digest = 2;
  // The redacted plan as JSON (buckle_core::plan::Plan).
  bytes plan_json = 3;
  uint32 changes = 4;
  uint32 removals = 5;
  bool destructive = 6;
  repeated string deferred_modules = 7;
  // Set when planning itself failed.
  string error = 8;
  // Modules that are selected but could not be planned ("module: reason").
  // The plan is still valid: applying it reports those modules as failed and
  // runs the others.
  repeated string module_errors = 9;
  // Digest of the plan's intent (resources, actions, removals, deferred
  // modules) without rendered text; what an approval binds. Empty from
  // agents that predate it.
  string approval_digest = 10;
  // The target this concerns: a cluster target's name, or empty for the
  // host itself.
  string target = 11;
}

message ApplyEvent {
  string revision = 1;
  string plan_digest = 2;
  google.protobuf.Timestamp at = 3;
  // buckle_core::engine::ApplyEvent as JSON.
  bytes event_json = 4;
  // The module the event is about, when it is about one.
  string module = 5;
  // The step's id within the module (`kind[key]`, or `owner:handler` for a
  // handler), when the event is about a step. Empty from older agents.
  string step_id = 6;
  // The state the event leaves the step in: running, changed, unchanged,
  // failed, blocked or skipped. Empty when the event is not about a step.
  string step_state = 7;
  // The step's error, structured, when it failed.
  ErrorDetail error = 8;
  // The target this concerns: a cluster target's name, or empty for the
  // host itself.
  string target = 9;
}

// A structured error: what went wrong, the causes beneath it (outermost
// first) and what to try, so that no reader has to parse a dumped string.
message ErrorDetail {
  // "user" or "system".
  string kind = 1;
  string message = 2;
  repeated string causes = 3;
  repeated string advice = 4;
}

message ApplyResult {
  string revision = 1;
  string plan_digest = 2;
  bool succeeded = 3;
  google.protobuf.Duration duration = 4;
  uint32 changes = 5;
  uint32 removals = 6;
  string applied_revision = 7;
  string failed_module = 8;
  repeated string rolled_back_modules = 9;
  repeated string not_started_modules = 10;
  string error = 11;
  // buckle_core::engine::ApplyOutcome as JSON, for the full module breakdown.
  bytes outcome_json = 12;
  // Checks that failed (module/check), for the operator's continue decision.
  repeated string failed_checks = 13;
  // Monotonic per agent. The agent keeps the result until the server
  // acknowledges this id (Ack) and re-sends it after every Welcome; the
  // server stores it once per (host, report_id). 0 from older agents.
  uint64 report_id = 14;
  // Nothing failed outright but steps stayed blocked: the revision is not
  // fully applied and nothing was rolled back; an operator must look.
  bool needs_attention = 15;
  // The run-level error (not a module's), structured. Module and step
  // errors are in outcome_json.
  ErrorDetail error_detail = 16;
  // Deferred modules not applied because their real plan diverged from the
  // approved preview: the host needs re-planning and approval, not repair.
  repeated string stale_modules = 17;
  // The run asked for a reboot. The agent reboots once the server has
  // acknowledged this result (or after a short grace with no session).
  Reboot reboot = 18;
  // The target this concerns: a cluster target's name, or empty for the
  // host itself.
  string target = 19;
}

message Reboot {
  // How long the agent waits after the acknowledgement before rebooting.
  google.protobuf.Duration delay = 1;
  // How long the server waits for the agent to come back from a new boot.
  google.protobuf.Duration timeout = 2;
  // The boot the run happened in (Hello.boot_id).
  string boot_id = 3;
  // What asked for it: `module/kind[key]` or `owner:handler`.
  repeated string requested_by = 4;
}

// The reboot an ApplyResult announced could not be started: the host stays
// up on the boot it ran in.
message RebootFailed {
  string boot_id = 1;
  string error = 2;
}

enum HealthScope {
  HEALTH_SCOPE_UNSPECIFIED = 0;
  HEALTH_SCOPE_BASELINE = 1;
  HEALTH_SCOPE_BAKE = 2;
  HEALTH_SCOPE_ROLLOUT = 3;
  HEALTH_SCOPE_DRIFT = 4;
  HEALTH_SCOPE_MANUAL = 5;
}

message HealthResult {
  string module = 1;
  string check = 2;
  string kind = 3;
  bool required = 4;
  bool passed = 5;
  // Set when the check could not run (unknown) rather than failed.
  bool unknown = 6;
  string reason = 7;
  google.protobuf.Timestamp at = 8;
  uint32 duration_ms = 9;
}

message HealthReport {
  HealthScope scope = 1;
  // Which RunHealth request this answers, when any.
  string request_id = 2;
  string revision = 3;
  repeated HealthResult results = 4;
  // The target this concerns: a cluster target's name, or empty for the
  // host itself.
  string target = 5;
}

message Drift {
  string revision = 1;
  // Non-empty plan digest and summary when something changed under us.
  string plan_digest = 2;
  uint32 changes = 3;
  uint32 removals = 4;
  bool corrected = 5;
  bytes plan_json = 6;
  // The target this concerns: a cluster target's name, or empty for the
  // host itself.
  string target = 7;
}

message LocalRollback {
  string from_revision = 1;
  string to_revision = 2;
  string reason = 3;
  google.protobuf.Timestamp at = 4;
  // Modules re-applied, or empty for a whole-revision rollback.
  repeated string modules = 5;
  // The failing checks that justified the rollback.
  repeated HealthResult evidence = 6;
  // Whether the rollback apply itself succeeded. When it did not, the host
  // needs attention and both results (the failure and the rollback's) are
  // recorded.
  bool succeeded = 7;
  // Durable like ApplyResult.report_id: kept until acknowledged.
  uint64 report_id = 8;
  // The rollback apply's own error, when it failed.
  string rollback_error = 9;
  // The rollback apply's buckle_core::engine::ApplyOutcome as JSON (its
  // module results and health), when it ran.
  bytes rollback_outcome_json = 10;
}

// ---------------------------------------------------------------- server → agent

message ServerMessage {
  oneof msg {
    Welcome welcome = 1;
    Assign assign = 2;
    RequestPlan plan = 3;
    Apply apply = 4;
    Rollback rollback = 5;
    RunHealth health = 6;
    Ping ping = 7;
    Upgrade upgrade = 8;
    Rejected rejected = 9;
    Ack ack = 10;
    HostUpdate host_update = 11;
  }
}

// The host's record changed while it is connected (approved, paused,
// resumed, labels edited): the parts of Welcome that describe the host,
// pushed without a reconnect.
message HostUpdate {
  // pending, active or paused.
  string status = 1;
  // Effective labels after server overrides.
  map<string, string> labels = 2;
  // The fleet's stable revision and the secrets scoped to the host for it
  // (sent when the host is active), as in Welcome.
  string stable_revision = 3;
  SecretBundle secrets = 4;
  // Digest of the stable revision's tarball, as in Welcome.
  string stable_tree_digest = 5;
}

// The server stored these durable reports (ApplyResult, LocalRollback) in a
// committed transaction; the agent may forget them.
message Ack {
  repeated uint64 report_ids = 1;
}

message Welcome {
  string server_version = 1;
  string session_id = 2;
  // The fleet's current stable revision; the agent caches it for local rollback.
  string stable_revision = 3;
  // Per-host token to persist (set on enrolment or rotation).
  string issued_token = 4;
  // Effective labels after server overrides.
  map<string, string> labels = 5;
  // Host status as the server sees it: pending, active, paused.
  string status = 6;
  SecretBundle secrets = 7;
  // Digest of the stable revision's tarball; the agent verifies the tree it
  // caches for local rollback (and every re-fetch) against it.
  string stable_tree_digest = 8;
}

message Assign {
  string revision = 1;
  bool stable = 2;
  SecretBundle secrets = 3;
  // Digest of the revision tarball, for cache validation.
  string tree_digest = 4;
  // The target this concerns: a cluster target's name, or empty for the
  // host itself.
  string target = 5;
}

message RequestPlan {
  string revision = 1;
  // Optional task selector (filt-rs) to restrict the plan.
  string select = 2;
  // The target this concerns: a cluster target's name, or empty for the
  // host itself.
  string target = 3;
}

message Apply {
  string revision = 1;
  // The plan digest the operator approved; the agent refuses a different fresh plan.
  string plan_digest = 2;
  string approval_token = 3;
  // Checks waived for this run (module/check), for `continue`.
  repeated string waived_checks = 4;
  string rollout_id = 5;
  string phase = 6;
  // Operator forced an apply despite a failing baseline.
  bool force = 7;
  // W3C trace context of the rollout span driving this apply; the agent's
  // `agent.apply` span uses it as its parent. Empty when not traced.
  string traceparent = 8;
  // The task selector of the RequestPlan whose plan was approved; the agent
  // re-plans with it so the digest can match. Empty: the whole revision.
  string select = 9;
  // Apply whatever the host plans now, without comparing digests: an
  // operator's force apply. Needs the "force_plan" capability.
  bool force_plan = 10;
  // The approved intent digest (PlanResult.approval_digest). When set, the
  // agent compares it with its fresh plan's intent instead of plan_digest.
  string approval_digest = 11;
  // The target this concerns: a cluster target's name, or empty for the
  // host itself.
  string target = 12;
}

message Rollback {
  string revision = 1;
  string reason = 2;
  string rollout_id = 3;
  // W3C trace context of the span driving this rollback, when traced.
  string traceparent = 4;
  // The target this concerns: a cluster target's name, or empty for the
  // host itself.
  string target = 5;
}

message RunHealth {
  string request_id = 1;
  HealthScope scope = 2;
  // Modules to check; empty means every applied module.
  repeated string modules = 3;
  // For bake: repeat until this instant.
  google.protobuf.Timestamp until = 4;
  // W3C trace context of the span requesting the checks, when traced.
  string traceparent = 5;
  // The target this concerns: a cluster target's name, or empty for the
  // host itself.
  string target = 6;
}

message Ping {
  google.protobuf.Timestamp at = 1;
}

message Upgrade {
  string version = 1;
  // Only when the agent is idle.
  bool when_idle = 2;
}

// How an Upgrade went. Sent before the agent exits to restart into a new
// binary (best effort: the reconnect's Hello is what confirms it).
message UpgradeResult {
  // The version the Upgrade asked for.
  string version = 1;
  UpgradeOutcome outcome = 2;
  // Why it failed, for the operator.
  string error = 3;
}

enum UpgradeOutcome {
  UPGRADE_OUTCOME_UNSPECIFIED = 0;
  // Installed; the agent is restarting into it.
  UPGRADE_OUTCOME_UPDATED = 1;
  // Already running the requested version.
  UPGRADE_OUTCOME_UP_TO_DATE = 2;
  UPGRADE_OUTCOME_FAILED = 3;
}

message Rejected {
  // Why the session is being closed: unknown host, bad token, version too old, paused.
  string reason = 1;
  bool retry = 2;
}

// ---------------------------------------------------------------- content

message FetchRevisionRequest {
  string revision = 1;
}

message FetchBlobRequest {
  string digest = 1;
}

message Chunk {
  bytes data = 1;
  // Total size, sent on the first chunk.
  uint64 total = 2;
  // Digest of the whole payload, sent on the last chunk.
  string digest = 3;
}

message FetchSecretsRequest {
  string revision = 1;
  repeated string names = 2;
}

message SecretValue {
  string name = 1;
  bytes value = 2;
  string fingerprint = 3;
}

message SecretBundle {
  repeated SecretValue secrets = 1;
}

// ---------------------------------------------------------------- identity

enum IdentityPurpose {
  IDENTITY_PURPOSE_UNSPECIFIED = 0;
  // Facts, plans and health: reading the cluster.
  IDENTITY_PURPOSE_READ = 1;
  // Applying workloads.
  IDENTITY_PURPOSE_DEPLOY = 2;
  // Draining the requesting host's own node.
  IDENTITY_PURPOSE_DRAIN = 3;
}

message IssueIdentityRequest {
  // The cluster target the credential is for (the token's audience).
  string target = 1;
  IdentityPurpose purpose = 2;
  // The revision whose fleet declares the target; one the host may fetch.
  // Empty: the fleet's stable revision.
  string revision = 3;
  // The rollout the credential serves, recorded in its claims and the audit
  // log. Empty outside a rollout.
  string rollout_id = 4;
}

message IssuedIdentity {
  // The signed JWT (compact JWS).
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
  // The token's `iss`, `aud` and `jti`.
  string issuer = 3;
  string audience = 4;
  string id = 5;
}
