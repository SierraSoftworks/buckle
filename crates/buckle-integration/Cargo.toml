[package]
name = "buckle-integration"
description = "End-to-end tests: a real buckle-server and several real buckle-agent sessions in one process, driven through the HTTP API."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Dev-only: the library is the test harness (fleet builder, server and agent
# harnesses, a cuttable TCP proxy, an API client that journals every body,
# SSE capture and process-wide log capture); the scenarios live in tests/.
# Nothing at runtime depends on this crate.

[dependencies]
buckle-core = { workspace = true, features = ["testing"] }
buckle-std.workspace = true
buckle-agent.workspace = true
buckle-server.workspace = true
buckle-api.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
prost.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
rstest.workspace = true
