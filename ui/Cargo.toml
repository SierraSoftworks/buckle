[package]
name = "buckle-ui"
description = "The Buckle web UI, compiled to WebAssembly with Trunk and embedded into the server."
version = "2.0.0-dev"
edition = "2024"
authors = ["Benjamin Pannell <benjamin@pannell.dev>"]
license = "MIT"
publish = false

# Standalone: the UI is excluded from the workspace because it targets wasm32.
[workspace]

[dependencies]
buckle-api = { path = "../crates/buckle-api" }
yew = { version = "0.23", features = ["csr"] }
yew-router = "0.20"
gloo-net = { version = "0.6", features = ["http", "eventsource"] }
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-utils = "0.2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "History", "Storage", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "EventSource", "MessageEvent", "UrlSearchParams"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["wasmbind", "serde"] }
futures = "0.3"
log = "0.4"
wasm-logger = "0.2"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
