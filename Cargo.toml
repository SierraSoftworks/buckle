[workspace]
resolver = "3"
members = [
    "crates/buckle",
    "crates/buckle-core",
    "crates/buckle-std",
    "crates/buckle-proto",
    "crates/buckle-api",
    "crates/buckle-agent",
    "crates/buckle-server",
    "crates/buckle-integration",
    "crates/buckle-nomad",
    "crates/buckle-kube",
]
# The `ui` crate is compiled to WebAssembly with `trunk` and embedded into the
# server at build time; it is excluded so that `cargo build` of the workspace
# does not try to compile it for the host target.
exclude = ["ui"]

[workspace.package]
version = "2.0.0-dev"
edition = "2024"
authors = ["Benjamin Pannell <benjamin@pannell.dev>"]
license = "MIT"
repository = "https://github.com/SierraSoftworks/buckle"
rust-version = "1.88"

[workspace.dependencies]
buckle-core = { path = "crates/buckle-core" }
buckle-std = { path = "crates/buckle-std" }
buckle-proto = { path = "crates/buckle-proto" }
buckle-api = { path = "crates/buckle-api" }
buckle-agent = { path = "crates/buckle-agent" }
buckle-server = { path = "crates/buckle-server" }
buckle-nomad = { path = "crates/buckle-nomad" }
buckle-kube = { path = "crates/buckle-kube" }

# Core
aho-corasick = "1.1.5"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
ciborium = "0.2.2"
filt-rs = { version = "1.1.3", features = ["serde", "secrecy", "chrono", "regex"] }
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
human-errors = { version = "0.2.4", features = ["pretty"] }
humantime-serde = "1.1.1"
indexmap = { version = "2.14", features = ["serde"] }
inventory = "0.3.25"
ipnet = "2.12.2"
minijinja = { version = "3.0.5", features = ["json", "builtins", "loop_controls", "multi_template", "macros", "unicase", "serde"] }
rand = "0.10.3"
regex = "1.11"
schemars = { version = "1.2.3", features = ["chrono04"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
similar = "3.2.1"
thiserror = "2.0.21"
tokio = { version = "1.50", features = ["macros", "rt", "rt-multi-thread", "fs", "sync", "time", "process", "signal", "io-util", "net"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-batteries = { git = "https://github.com/sierrasoftworks/tracing-batteries-rs.git", features = ["opentelemetry", "testing"] }
unicase = "2.9.0"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.29", features = ["v4", "serde"] }

# Host interaction
nix = { version = "0.31.3", features = ["user", "fs", "process", "signal"] }
os_info = { version = "3.15", default-features = false }
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
zip = { version = "9.2.1", default-features = false, features = ["deflate-flate2"] }
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "charset", "http2"] }

# Protocol
prost = "0.14.4"
prost-types = "0.14.4"
tonic = { version = "0.14.9", features = ["transport", "tls-ring", "tls-native-roots", "gzip"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tonic-prost = "0.14.9"
tonic-build = "0.14.9"
tonic-prost-build = "0.14.9"
protoc-bin-vendored = "3.3.0"
tower = "0.5.3"
hyper-util = { version = "0.1.21", features = ["tokio"] }
hyper = "1.12"
http-body-util = "0.1.5"

# Clusters
bytes = "1.12"
hcl-rs = "0.20.0"

# Server
actix-web = { version = "4.18", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "cookies", "unicode"] }
gix = { version = "0.90.0", features = ["blocking-http-transport-reqwest-rust-tls", "blocking-network-client", "revision", "worktree-mutation", "interrupt"] }
include_dir = "0.7.4"
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
rusqlite = { version = "0.41", features = ["bundled", "chrono"] }
notify = "9.0.0-rc.7"
base64 = "0.23.1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
percent-encoding = "2.3.2"

# CLI
clap = { version = "4.6", features = ["derive", "env", "string", "cargo"] }
update-rs = { version = "0.4.1", default-features = false, features = ["tracing"] }
semver = "1.0"
dirs = "7.0"

# Testing
rstest = "0.28.0"
tempfile = "3.27"
wiremock = "0.6.5"
tracing-subscriber = "0.3.23"
pretty_assertions = "1.4"
rsa = { version = "0.9", features = ["getrandom", "sha2"] }
actix-http = "3.11"

[profile.release]
# Thin LTO: about half the link time of fat LTO (338 s to 186 s for a
# buckle-core change on 4 cores) for a ~10% larger binary.
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
debug = false

[profile.dev.package."*"]
opt-level = 1
