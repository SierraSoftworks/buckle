name: Test

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-fail-fast

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm trunk
      - run: cd ui && trunk build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  containers:
    name: Apply example (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:bookworm", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The images carry an older glibc than the runner (bookworm has 2.36, the
      # runner 2.39), so a default release build would not start in them. The
      # static musl binary, which is also what the release matrix ships, does.
      - run: cargo build --release -p buckle --target x86_64-unknown-linux-musl
      - name: Plan the example inside ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src:ro" ${{ matrix.image }} bash -c '
            set -euo pipefail
            if [ -x /src/scripts/container-test.sh ]; then /src/scripts/container-test.sh; else echo "container test script not present yet"; fi
          '
