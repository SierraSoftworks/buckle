name: Test

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request supersedes the run in flight; main runs to
# completion so that every merge is tested and refreshes the caches.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Line tables keep test backtraces useful while making target/ (and so every
  # cache entry) far smaller and links faster than full debuginfo.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Decides which suites a change can affect. The Rust workspace never reads
  # ui/ (the server embeds a placeholder UI in tests) and reads docs/ only to
  # check the documentation site's generated reference, and the UI only
  # depends on buckle-api and the workspace manifest.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.rust.outputs.rust }}
      ui: ${{ steps.ui.outputs.ui }}
      docs: ${{ steps.docs.outputs.docs }}
      install: ${{ steps.install.outputs.install }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: rust
        with:
          predicate-quantifier: every
          filters: |
            rust:
              - '**'
              - '!ui/**'
              - '!docs/**'
              - '!**/*.md'
      - uses: dorny/paths-filter@v4
        id: docs
        with:
          filters: |
            docs:
              - 'docs/**/*.md'
              - 'docs/.vuepress/data/**'
      - uses: dorny/paths-filter@v4
        id: install
        with:
          filters: |
            install:
              - 'docs/.vuepress/public/install.*'
              - '.github/workflows/test.yml'
      - uses: dorny/paths-filter@v4
        id: ui
        with:
          filters: |
            ui:
              - 'ui/**'
              - 'crates/buckle-api/**'
              - 'Cargo.toml'
              - '.github/workflows/test.yml'

  test:
    name: Test (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows runners are slow or scarce, so pull requests skip
        # them; main still runs every platform.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","ubuntu-24.04-arm"]' || '["ubuntu-latest","ubuntu-24.04-arm","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: ${{ matrix.os == 'ubuntu-latest' && 'rustfmt, clippy' || '' }}
      # Only main saves caches: pull requests restore main's, so a PR (and
      # every Dependabot bump) no longer adds a branch-scoped copy of each.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Lint shares the x64 Linux runner and cache: clippy and the tests reuse
      # the same build scripts and proc-macros.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The Nomad executor's integration tests (crates/buckle-nomad/tests)
      # run against a dev agent here and skip on the other runners.
      - if: matrix.os == 'ubuntu-latest'
        name: Start a Nomad dev agent
        run: scripts/nomad-dev-agent.sh
      # The Kubernetes executor's integration tests (crates/buckle-kube/tests)
      # run against a single-node k3s, likewise only here.
      - if: matrix.os == 'ubuntu-latest'
        name: Start a k3s server
        run: sudo --preserve-env=GITHUB_ENV,RUNNER_TEMP scripts/k3s-dev-server.sh
      - run: cargo test --workspace --no-fail-fast
      - if: failure() && matrix.os == 'ubuntu-latest'
        name: Nomad agent log
        run: cat "$RUNNER_TEMP/nomad-dev/agent.log" || true
      - if: failure() && matrix.os == 'ubuntu-latest'
        name: k3s server log
        run: sudo tail -n 200 "$RUNNER_TEMP/k3s-dev/server.log" || true

  ui:
    name: UI
    needs: [changes]
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm trunk
      # The UI is excluded from the workspace (it targets wasm32), so the
      # workspace lint job never sees it.
      - name: Lint
        working-directory: ui
        run: |
          cargo fmt --check
          cargo clippy --target wasm32-unknown-unknown -- -D warnings
      # The logic modules touch no DOM, so they run on the host target.
      - name: Unit tests
        working-directory: ui
        run: cargo test
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # Demo mode is compiled out of release bundles, so the suite builds a
      # debug bundle of its own into ui/dist-e2e and drives it with ?demo.
      - name: End-to-end tests
        working-directory: ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - run: cd ui && trunk build --release
      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist

  # Runs alongside the test matrix rather than after it, and builds the binary
  # once for both images.
  containers:
    name: Apply example in containers
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # The release profile (optimised, panic = abort) without its fat LTO and
      # single codegen unit, which only shrink the binary and take minutes.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The images carry an older glibc than the runner (bookworm has 2.36, the
      # runner 2.39), so a default release build would not start in them. The
      # static musl binary, which is also what the release matrix ships, does.
      - id: build
        run: cargo build --release -p buckle --target x86_64-unknown-linux-musl
      - name: Plan and apply the example inside debian:bookworm
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm -v "$PWD:/src:ro" debian:bookworm /src/scripts/container-test.sh
          scripts/container-apply.sh debian:bookworm target/x86_64-unknown-linux-musl/release/buckle
      - name: Plan and apply the example inside ubuntu:24.04
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm -v "$PWD:/src:ro" ubuntu:24.04 /src/scripts/container-test.sh
          scripts/container-apply.sh ubuntu:24.04 target/x86_64-unknown-linux-musl/release/buckle

  # The one-line installers, against the latest published release: the
  # platform detection, digest check and hand-off to the installed binary.
  install-scripts:
    name: Install script (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.install == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os != 'Windows'
        run: |
          if command -v shellcheck >/dev/null; then shellcheck -s sh docs/.vuepress/public/install.sh; fi
          sudo -E sh -s -- --install-dir "$RUNNER_TEMP/bin" catalog --json \
            < docs/.vuepress/public/install.sh > catalog.json
          grep -q '"tasks"' catalog.json
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sb = [scriptblock]::Create((Get-Content -Raw docs/.vuepress/public/install.ps1))
          & $sb -InstallDir "$env:RUNNER_TEMP\bin" catalog --json > catalog.json
          if (-not (Select-String -Quiet '"tasks"' catalog.json)) { throw 'buckle catalog did not run' }

  # The required status check on main: one stable name that goes green once
  # every job the change needs has passed (a skipped suite counts as passed).
  test-done:
    name: Tests Complete
    needs: [changes, test, ui, containers, install-scripts]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "Tests Complete for All Platforms"
